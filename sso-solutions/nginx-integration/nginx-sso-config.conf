# Nginx配置 - 作为Apache的替代方案
# 提供更好的性能和灵活性

upstream polarion_instance1 {
    server localhost:8080;
    keepalive 32;
}

upstream polarion_instance2 {
    server localhost:8090;
    keepalive 32;
}

upstream sso_service {
    server localhost:8100;
    keepalive 16;
}

# 项目到实例的映射
map $arg_project $polarion_backend {
    ~^(projectA|projectB|projectC)$ polarion_instance1;
    ~^(projectX|projectY|projectZ)$ polarion_instance2;
    default polarion_instance1;
}

# HTTP重定向到HTTPS
server {
    listen 80;
    server_name polarion.company.com;
    return 301 https://$server_name$request_uri;
}

# 主服务器配置
server {
    listen 443 ssl http2;
    server_name polarion.company.com;
    
    # SSL配置
    ssl_certificate /etc/ssl/certs/polarion.crt;
    ssl_certificate_key /etc/ssl/private/polarion.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 日志
    access_log /var/log/nginx/polarion_access.log;
    error_log /var/log/nginx/polarion_error.log;
    
    # 根路径
    location / {
        return 301 /polarion;
    }
    
    # SSO服务
    location /sso {
        proxy_pass http://sso_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSO特定配置
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Polarion统一入口
    location /polarion {
        # SSO认证检查
        auth_request /auth;
        auth_request_set $auth_status $upstream_status;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        auth_request_set $auth_roles $upstream_http_x_auth_roles;
        
        # 如果未认证，重定向到登录页
        error_page 401 = @error401;
        
        # 根据项目路由到不同实例
        set $backend $polarion_backend;
        
        # 重写路径并代理
        rewrite ^/polarion(.*)$ /polarion$1 break;
        proxy_pass http://$backend;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-User $auth_user;
        proxy_set_header X-Auth-Roles $auth_roles;
        
        # WebSocket支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # 缓冲区设置
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_temp_file_write_size 512k;
    }
    
    # Polarion实例1专用路径
    location /polarion1 {
        auth_request /auth;
        error_page 401 = @error401;
        
        # Cookie路径重写
        proxy_cookie_path /polarion /polarion1;
        
        # 代理到实例1
        rewrite ^/polarion1(.*)$ /polarion$1 break;
        proxy_pass http://polarion_instance1;
        
        include /etc/nginx/proxy_params;
        
        # 修改响应头中的Set-Cookie
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $modified_cookie_instance1;
    }
    
    # Polarion实例2专用路径
    location /polarion2 {
        auth_request /auth;
        error_page 401 = @error401;
        
        # Cookie路径重写
        proxy_cookie_path /polarion /polarion2;
        
        # 代理到实例2
        rewrite ^/polarion2(.*)$ /polarion$1 break;
        proxy_pass http://polarion_instance2;
        
        include /etc/nginx/proxy_params;
        
        # 修改响应头中的Set-Cookie
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $modified_cookie_instance2;
    }
    
    # 认证检查端点
    location = /auth {
        internal;
        proxy_pass http://sso_service/sso/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Cookie $http_cookie;
    }
    
    # 401错误处理
    location @error401 {
        return 302 /sso/login?redirect=$scheme://$host$request_uri;
    }
    
    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://$polarion_backend;
        proxy_cache static_cache;
        proxy_cache_valid 200 1d;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        expires 1d;
    }
    
    # 健康检查
    location /health {
        access_log off;
        default_type text/plain;
        content_by_lua_block {
            local backends = {
                {name = "Polarion Instance 1", url = "http://localhost:8080/polarion/health"},
                {name = "Polarion Instance 2", url = "http://localhost:8090/polarion/health"},
                {name = "SSO Service", url = "http://localhost:8100/sso/health"}
            }
            
            local all_healthy = true
            local response = "Health Check Results:\n"
            
            for _, backend in ipairs(backends) do
                local http = require "resty.http"
                local httpc = http.new()
                local res, err = httpc:request_uri(backend.url, {method = "GET"})
                
                if res and res.status == 200 then
                    response = response .. backend.name .. ": OK\n"
                else
                    response = response .. backend.name .. ": FAIL\n"
                    all_healthy = false
                end
            end
            
            if all_healthy then
                ngx.status = ngx.HTTP_OK
            else
                ngx.status = ngx.HTTP_SERVICE_UNAVAILABLE
            end
            
            ngx.say(response)
        }
    }
}

# 缓存配置
proxy_cache_path /var/cache/nginx/polarion levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=1d use_temp_path=off;

# 速率限制
limit_req_zone $binary_remote_addr zone=polarion_limit:10m rate=100r/s;
limit_req zone=polarion_limit burst=200 nodelay;

# Cookie修改映射
map $upstream_http_set_cookie $modified_cookie_instance1 {
    ~^(.*)JSESSIONID=([^;]+)(.*)$ "${1}POLARION1_JSESSIONID=${2}; Path=/polarion1${3}";
    default $upstream_http_set_cookie;
}

map $upstream_http_set_cookie $modified_cookie_instance2 {
    ~^(.*)JSESSIONID=([^;]+)(.*)$ "${1}POLARION2_JSESSIONID=${2}; Path=/polarion2${3}";
    default $upstream_http_set_cookie;
}