# CAS服务器配置文件
# 用于Polarion多实例SSO集成

# CAS服务器基本配置
cas.server.name=https://sso.company.com
cas.server.prefix=${cas.server.name}/cas
cas.host.name=sso.company.com

# 认证配置
cas.authn.accept.users=

# LDAP认证配置（推荐用于企业环境）
cas.authn.ldap[0].type=AUTHENTICATED
cas.authn.ldap[0].ldapUrl=ldap://ldap.company.com:389
cas.authn.ldap[0].useSsl=false
cas.authn.ldap[0].baseDn=ou=users,dc=company,dc=com
cas.authn.ldap[0].searchFilter=uid={user}
cas.authn.ldap[0].bindDn=cn=admin,dc=company,dc=com
cas.authn.ldap[0].bindCredential=admin-password

# 数据库认证配置（备选方案）
cas.authn.jdbc.query[0].sql=SELECT password FROM users WHERE username=?
cas.authn.jdbc.query[0].url=jdbc:postgresql://localhost:5432/cas_users
cas.authn.jdbc.query[0].dialect=org.hibernate.dialect.PostgreSQLDialect
cas.authn.jdbc.query[0].user=cas_user
cas.authn.jdbc.query[0].password=cas_password
cas.authn.jdbc.query[0].driverClass=org.postgresql.Driver

# 票据配置
cas.ticket.tgt.rememberMe.enabled=true
cas.ticket.tgt.rememberMe.timeToKillInSeconds=7200
cas.ticket.tgt.timeout.maxTimeToLiveInSeconds=28800
cas.ticket.st.timeToKillInSeconds=10

# 服务注册
cas.serviceRegistry.json.location=file:/etc/cas/services
cas.serviceRegistry.initFromJson=true

# Session配置
cas.ticket.registry.redis.host=localhost
cas.ticket.registry.redis.port=6379
cas.ticket.registry.redis.database=0
cas.ticket.registry.redis.timeout=2000

# 日志配置
cas.logging.config=file:/etc/cas/log4j2.xml
logging.level.org.apereo.cas=INFO

# 主题和UI配置
cas.theme.defaultThemeName=polarion
cas.view.cas2.success=casPolarionServiceSuccessView
cas.view.cas3.success=casPolarion3ServiceSuccessView

# 监控和管理端点
management.endpoints.web.exposure.include=health,status,info,configurationMetadata
management.endpoints.web.base-path=/cas/actuator

# CORS配置（用于Ajax请求）
cas.httpWebRequest.cors.enabled=true
cas.httpWebRequest.cors.allowOrigins[0]=https://polarion.company.com
cas.httpWebRequest.cors.allowMethods[0]=*
cas.httpWebRequest.cors.allowHeaders[0]=*

# 多因素认证（可选）
cas.authn.mfa.simple.trustedDeviceEnabled=true
cas.authn.mfa.simple.timeToKillInSeconds=300