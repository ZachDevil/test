# Apache配置文件 - Polarion多实例部署
# 此配置解决Session/Cookie冲突并实现统一登录

# 加载必要的模块
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule session_module modules/mod_session.so
LoadModule session_cookie_module modules/mod_session_cookie.so
LoadModule auth_form_module modules/mod_auth_form.so

# 主虚拟主机配置
<VirtualHost *:80>
    ServerName polarion.company.com
    DocumentRoot /var/www/html
    
    # 错误日志
    ErrorLog ${APACHE_LOG_DIR}/polarion_error.log
    CustomLog ${APACHE_LOG_DIR}/polarion_access.log combined
    
    # 开启重写引擎
    RewriteEngine On
    
    # Session配置
    Session On
    SessionCookieName session_polarion_unified
    SessionCookiePath /
    SessionCryptoPassphrase "your-secret-passphrase-here"
    
    # ========== SSO认证配置 ==========
    <Location /sso>
        ProxyPass http://localhost:8100/sso
        ProxyPassReverse http://localhost:8100/sso
        
        # 不需要认证的路径
        <LocationMatch "^/sso/(login|authenticate|public)">
            Require all granted
        </LocationMatch>
    </Location>
    
    # SSO登录页面
    <Location /login>
        ProxyPass http://localhost:8100/sso/login
        ProxyPassReverse http://localhost:8100/sso/login
    </Location>
    
    # ========== Polarion实例1配置 ==========
    <Location /polarion1>
        # SSO认证检查
        AuthType form
        AuthName "Polarion SSO"
        AuthFormProvider custom
        AuthFormLoginRequiredLocation /login?redirect=%{REQUEST_URI}
        AuthFormLoginSuccessLocation /polarion1/
        Require valid-user
        
        # 代理配置
        ProxyPass http://localhost:8080/polarion
        ProxyPassReverse http://localhost:8080/polarion
        
        # Cookie路径重写
        ProxyPassReverseCookiePath /polarion /polarion1
        ProxyPassReverseCookieDomain localhost polarion.company.com
        
        # 修改Set-Cookie头，添加实例标识
        Header edit Set-Cookie "^(.*)(JSESSIONID=.*?);(.*)$" "$1POLARION1_$2;$3"
        Header edit Set-Cookie "Path=/polarion" "Path=/polarion1"
        
        # 添加实例标识头
        RequestHeader set X-Polarion-Instance "instance1"
        
        # 注入SSO用户信息
        RequestHeader set X-Remote-User %{REMOTE_USER}e
        RequestHeader set X-Auth-Token %{HTTP_COOKIE}e
    </Location>
    
    # ========== Polarion实例2配置 ==========
    <Location /polarion2>
        # SSO认证检查
        AuthType form
        AuthName "Polarion SSO"
        AuthFormProvider custom
        AuthFormLoginRequiredLocation /login?redirect=%{REQUEST_URI}
        AuthFormLoginSuccessLocation /polarion2/
        Require valid-user
        
        # 代理配置
        ProxyPass http://localhost:8090/polarion
        ProxyPassReverse http://localhost:8090/polarion
        
        # Cookie路径重写
        ProxyPassReverseCookiePath /polarion /polarion2
        ProxyPassReverseCookieDomain localhost polarion.company.com
        
        # 修改Set-Cookie头，添加实例标识
        Header edit Set-Cookie "^(.*)(JSESSIONID=.*?);(.*)$" "$1POLARION2_$2;$3"
        Header edit Set-Cookie "Path=/polarion" "Path=/polarion2"
        
        # 添加实例标识头
        RequestHeader set X-Polarion-Instance "instance2"
        
        # 注入SSO用户信息
        RequestHeader set X-Remote-User %{REMOTE_USER}e
        RequestHeader set X-Auth-Token %{HTTP_COOKIE}e
    </Location>
    
    # ========== 统一入口页面 ==========
    <Location /polarion>
        # 根据项目或其他条件路由到不同实例
        RewriteEngine On
        
        # 检查URL中的项目参数
        RewriteCond %{QUERY_STRING} project=([^&]+)
        RewriteMap projectmap txt:/etc/apache2/project-instance-map.txt
        RewriteRule ^/polarion(.*)$ /polarion${projectmap:%1|1}$1 [PT,L]
        
        # 默认路由到实例1
        RewriteRule ^/polarion(.*)$ /polarion1$1 [PT,L]
    </Location>
    
    # ========== 静态资源优化 ==========
    <LocationMatch "^/polarion[12]?/.*\.(js|css|png|jpg|gif|ico)$">
        # 设置缓存头
        Header set Cache-Control "public, max-age=86400"
        
        # 启用压缩
        SetOutputFilter DEFLATE
    </LocationMatch>
    
    # ========== 健康检查端点 ==========
    <Location /health>
        SetHandler server-status
        Require ip 127.0.0.1 ::1
        
        # 自定义健康检查
        RewriteEngine On
        RewriteRule ^/health/polarion1$ http://localhost:8080/polarion/api/health [P,L]
        RewriteRule ^/health/polarion2$ http://localhost:8090/polarion/api/health [P,L]
    </Location>
    
    # ========== WebSocket支持 ==========
    <LocationMatch "^/polarion[12]?/ws">
        ProxyPass ws://localhost:8080/polarion/ws
        ProxyPassReverse ws://localhost:8080/polarion/ws
        
        # WebSocket特定头
        RequestHeader set Upgrade %{HTTP:Upgrade}e
        RequestHeader set Connection "Upgrade"
    </LocationMatch>
    
    # ========== 错误处理 ==========
    ErrorDocument 404 /error/404.html
    ErrorDocument 500 /error/500.html
    ErrorDocument 503 /error/503.html
    
    # 代理超时设置
    ProxyTimeout 300
    ProxyBadHeader Ignore
    
    # ========== 安全配置 ==========
    # 隐藏Apache版本
    ServerTokens Prod
    ServerSignature Off
    
    # 防止点击劫持
    Header always append X-Frame-Options SAMEORIGIN
    
    # XSS保护
    Header set X-XSS-Protection "1; mode=block"
    
    # 内容类型选项
    Header set X-Content-Type-Options nosniff
</VirtualHost>

# HTTPS配置（推荐用于生产环境）
<VirtualHost *:443>
    ServerName polarion.company.com
    
    # SSL配置
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/polarion.crt
    SSLCertificateKeyFile /etc/ssl/private/polarion.key
    SSLCertificateChainFile /etc/ssl/certs/polarion-chain.crt
    
    # SSL协议和加密套件
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    
    # HSTS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # 包含上面的所有配置
    Include /etc/apache2/sites-available/polarion-base.conf
</VirtualHost>